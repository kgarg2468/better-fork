<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" role="img" aria-labelledby="title desc">
  <title id="title">Bring the conversation with you</title>
  <desc id="desc">Illustrative conversation handoff. An old session holds the task, constraints, and progress. Invoke $fork with its ID in the current chat to load its public history and continue with the current model and workspace.</desc>
  <style>
    .panel{fill:#161b22;stroke:#30363d;stroke-width:1.5}.line{stroke:#30363d}.label{font:13px Arial,Helvetica,sans-serif;fill:#a6b0bd}.text{font:15px Arial,Helvetica,sans-serif;fill:#e6edf3}.mono{font:14px 'Liberation Mono',Consolas,monospace;fill:#e6edf3}.accent{fill:#e08a4b}.green{fill:#56d364}
  </style>
  <rect class="panel" x="1" y="1" width="409" height="308" rx="12"/>
  <rect class="panel" x="470" y="1" width="409" height="308" rx="12"/>
  <path class="line" d="M1 40H410M470 40H879"/>
  <circle cx="21" cy="21" r="5" fill="#ff5f57"/><circle cx="39" cy="21" r="5" fill="#febc2e"/><circle cx="57" cy="21" r="5" fill="#28c840"/>
  <circle cx="490" cy="21" r="5" fill="#ff5f57"/><circle cx="508" cy="21" r="5" fill="#febc2e"/><circle cx="526" cy="21" r="5" fill="#28c840"/>
  <text class="label" x="224" y="26" text-anchor="middle">previous conversation</text>
  <text class="label" x="696" y="26" text-anchor="middle">your current chat</text>
  <text class="label accent" x="23" y="77">THE WORK SO FAR</text>
  <text class="text" x="23" y="113">“Add CSV export to the dashboard.”</text>
  <text class="text" x="23" y="151">“Keep the existing date format.”</text>
  <text class="text" x="23" y="189">“Export works. Unicode test is next.”</text>
  <path class="line" d="M23 218H387M492 218H856"/>
  <text class="label" x="23" y="247">T3, Claude Code, or Codex session ID</text>
  <text class="label" x="23" y="276">Source conversation stays intact.</text>
  <path d="M423 154H456m-8-7 8 7-8 7" fill="none" stroke="#e08a4b" stroke-width="2"/>
  <text class="mono accent" x="492" y="79">$fork YOUR_SESSION_ID</text>
  <text class="text green" x="492" y="119">Load the public conversation.</text>
  <text class="text" x="492" y="151">Recover decisions and progress.</text>
  <text class="text" x="492" y="183">Check the project. Continue here.</text>
  <text class="label" x="492" y="247">Your selected model. Your workspace.</text>
  <text class="label" x="492" y="276">Public text only; no tools or attachments.</text>
</svg>
