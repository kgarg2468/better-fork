<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" role="img" aria-labelledby="title desc">
  <title id="title">Context shaped around the next task</title>
  <desc id="desc">Experimental opt-in selector: reviewed public history and the next task inform an agent selection. All user records and selected supporting records stay verbatim. Other supporting records may be summarized. The receiver gets the selected context and can retrieve any reviewed record from the complete archive.</desc>
  <style>
    .bg{fill:#0d1117;stroke:#30363d}.box{fill:#161b22;stroke:#30363d;stroke-width:1.5}.title{font:bold 19px Arial,Helvetica,sans-serif;fill:#e6edf3}.text{font:15px Arial,Helvetica,sans-serif;fill:#e6edf3}.small{font:13px Arial,Helvetica,sans-serif;fill:#a6b0bd}.orange{fill:#e08a4b}.green{fill:#56d364}.arrow{fill:none;stroke:#e08a4b;stroke-width:2;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#e08a4b"/></marker></defs>
  <rect class="bg" x="1" y="1" width="878" height="408" rx="12"/>
  <text class="title" x="24" y="35">What does the next task need?</text>
  <text class="small orange" x="856" y="33" text-anchor="end">SELECTOR · EXPERIMENTAL OPT-IN</text>
  <rect class="box" x="24" y="64" width="224" height="70" rx="8"/>
  <text class="text" x="40" y="93">Reviewed public history</text><text class="small" x="40" y="116">The conversation so far</text>
  <rect class="box" x="24" y="157" width="224" height="70" rx="8"/>
  <text class="text" x="40" y="186">Your next task</text><text class="small" x="40" y="209">The direction you want to take</text>
  <path class="arrow" d="M248 99H270V145H294"/><path class="arrow" d="M248 192H270V145H294"/>
  <rect class="box" x="297" y="109" width="192" height="73" rx="8"/>
  <text class="text orange" x="393" y="138" text-anchor="middle">Agent selects context</text>
  <text class="small" x="393" y="163" text-anchor="middle">Helper validates the plan</text>
  <path class="arrow" d="M489 145H536"/>
  <rect class="box" x="539" y="64" width="317" height="163" rx="8"/>
  <text class="text green" x="555" y="94">Fresh receiver context</text>
  <text class="small" x="555" y="125">All user records — verbatim</text>
  <text class="small" x="555" y="153">Selected supporting records — verbatim</text>
  <text class="small" x="555" y="181">Other supporting details — summarized</text>
  <text class="small" x="555" y="209">Next task supplied separately</text>
  <rect class="box" x="297" y="279" width="559" height="75" rx="8"/>
  <path class="arrow" d="M136 227V316H294"/>
  <text class="text" x="315" y="309">Complete reviewed archive</text>
  <text class="small" x="315" y="335">Every reviewed record stays recoverable by ID.</text>
  <path class="arrow" d="M749 279V230"/>
  <text class="small" x="734" y="260" text-anchor="end">Retrieve when needed</text>
  <text class="small" x="24" y="386">Selection is optional. Ordinary $fork loads public conversation history into your current chat.</text>
</svg>
